server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Tamanho máximo de upload (fotos/documentos)
    client_max_body_size 50M;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Ocultar versão do Nginx
    server_tokens off;

    # Compressão gzip para melhor performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cache de assets estáticos (JS/CSS/imagens compilados pelo Vite)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy reverso para a API .NET (evita CORS em produção)
    location /api/ {
        proxy_pass http://gravity-api:5263/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Proxy para uploads de fotos (servidos pela API)
    location /uploads/ {
        proxy_pass http://gravity-api:5263/uploads/;
        proxy_set_header Host $host;
    }

    # Bloquear acesso a arquivos ocultos (ex: .env, .git)
    location ~ /\. {
        deny all;
        return 404;
    }

    # SPA routing: qualquer rota não encontrada → index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
