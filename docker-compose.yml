version: '3.9'

services:
  # ==========================================
  # Banco de Dados PostgreSQL (Produção / Dev)
  # ==========================================
  motors-xy-db:
    image: postgres:16-alpine
    container_name: motors-xy-db
    restart: always
    environment:
      POSTGRES_DB: motorsxysystem
      POSTGRES_USER: motorsxy_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-motorsxy_secret123!}
    volumes:
      - motors_xy_db_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motorsxy_user -d motorsxysystem"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - motors-xy-net

volumes:
  motors_xy_db_data:
    name: motors_xy_db_data

networks:
  motors-xy-net:
    name: motors-xy-net
    driver: bridge
